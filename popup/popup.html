<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design.md Extractor</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FFFFFF;
      --surface: #F0F0F0;
      --border: #E8E8E8;
      --text: #141414;
      --text-muted: #6B6B6B;
      --text-dim: #ADADAD;
      --blue: #1C6EF2;
      --mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
      --sans: 'Satoshi Variable', 'Satoshi', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    }

    body {
      width: 399px;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── View header (logo + subtitle) ──────────────────────── */

    .view-header {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo img {
      height: 22px;
      display: block;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.64);
      letter-spacing: -0.03em;
      line-height: 1.4;
    }

    .subtitle strong {
      font-weight: 700;
      color: rgba(0, 0, 0, 0.64);
    }

    .subtitle.hidden {
      display: none;
    }

    /* ── Views ───────────────────────────────────────────────── */

    [data-view] {
      display: none;
      flex-direction: column;
      gap: 24px;
    }

    [data-view].active {
      display: flex;
    }

    /* ── Extract button ──────────────────────────────────────── */

    .btn-extract {
      width: 100%;
      padding: 12px;
      background: #1B1B1B;
      color: #FFFFFF;
      border: none;
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-extract:hover:not(:disabled) {
      background: #2a2a2a;
    }

    .btn-extract:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ── Progress ────────────────────────────────────────────── */

    .progress-steps {
      display: flex;
      flex-direction: column;
      background: rgba(220, 220, 220, 0.32);
      padding: 8px;
      gap: 10px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.40);
      transition: color 0.2s;
    }

    .step.active { color: rgba(0, 0, 0, 0.64); }
    .step.done   { color: rgba(0, 0, 0, 0.40); }

    .step-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E2E2E2;
      transition: all 0.2s;
    }

    .step.active .step-circle {
      background: #E2E2E2;
      border: 1px solid #196FE2;
      animation: pulse-ring 1.2s ease-in-out infinite;
    }

    .step.done .step-circle {
      background: #C9D7E7;
      border: none;
    }

    .step.done .step-circle::after {
      content: '';
      display: block;
      width: 4px;
      height: 7px;
      border-right: 1.5px solid #196FE2;
      border-bottom: 1.5px solid #196FE2;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(25, 111, 226, 0.25); }
      50%       { box-shadow: 0 0 0 3px rgba(25, 111, 226, 0.10); }
    }

    /* ── Result ──────────────────────────────────────────────── */

    .result-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.64);
    }

    .result-stats {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.40);
    }

    .result-preview-wrap {
      position: relative;
    }

    .result-preview {
      background: rgba(220, 220, 220, 0.32);
      padding: 8px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.40);
      line-height: 1.5;
      height: 161px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-copy-preview {
      position: absolute;
      top: 6px;
      right: 6px;
      background: transparent;
      border: none;
      padding: 2px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.64);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .btn-copy-preview:hover { color: rgba(0, 0, 0, 0.90); }
    .btn-copy-preview svg { width: 14px; height: 14px; }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
    }

    .btn-download {
      width: 100%;
      padding: 12px;
      background: #1B1B1B;
      color: #FFFFFF;
      border: none;
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-download:hover { background: #2a2a2a; }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: #1B1B1B;
      color: #FFFFFF;
      border: none;
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-save:hover { background: #2a2a2a; }

    .btn-download-link {
      background: none;
      border: none;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.40);
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      transition: color 0.15s;
    }

    .btn-download-link:hover { color: rgba(0, 0, 0, 0.70); }

    .saved-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      background: #F0FAF4;
      border: 1px solid #C3E6CB;
      padding: 8px 10px;
      width: 100%;
    }

    .saved-indicator.visible { display: flex; }

    .saved-indicator svg {
      width: 13px;
      height: 13px;
      color: #28a745;
      flex-shrink: 0;
    }

    .saved-path {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: #28a745;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cli-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .cli-label {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.40);
    }

    .separator {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.64);
      text-align: center;
    }

    .cli-row {
      width: 100%;
      background: rgba(220, 220, 220, 0.32);
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cli-cmd {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: rgba(0, 0, 0, 0.40);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-copy-cli {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.64);
      padding: 2px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .btn-copy-cli:hover { color: rgba(0, 0, 0, 0.90); }
    .btn-copy-cli svg { width: 14px; height: 14px; }

    .btn-refresh {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.40);
      padding: 2px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .btn-refresh:hover { color: rgba(0, 0, 0, 0.90); }
    .btn-refresh svg { width: 13px; height: 13px; }

    /* ── Error ───────────────────────────────────────────────── */

    .error-box {
      background: #FFF2F2;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 12px;
      color: #C0392B;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Header: logo + subtitle (always visible, subtitle hidden on result/error) -->
  <div class="view-header">
    <div class="logo">
      <img src="../icons/logo.svg" alt="Design.md Extractor">
    </div>
    <p class="subtitle" id="subtitle">
      Extract design.md file from website: <strong id="siteHost">—</strong>
    </p>
  </div>

  <!-- VIEW: idle -->
  <div data-view="idle" class="active">
    <button class="btn-extract" id="btnExtract">Extract</button>
  </div>

  <!-- VIEW: progress -->
  <div data-view="progress">
    <div class="progress-steps">
      <div class="step" id="step1">
        <div class="step-circle"></div>
        <span>Scanning DOM & Computed Styles</span>
      </div>
      <div class="step" id="step2">
        <div class="step-circle"></div>
        <span>Extracting Colors & Typography</span>
      </div>
      <div class="step" id="step3">
        <div class="step-circle"></div>
        <span>Analyzing Components & Tokens</span>
      </div>
      <div class="step" id="step4">
        <div class="step-circle"></div>
        <span>Generating Design.md File</span>
      </div>
    </div>
    <button class="btn-extract" disabled>Extract</button>
  </div>

  <!-- VIEW: result -->
  <div data-view="result">

    <!-- Frame 13: header + preview -->
    <div class="result-content">
      <div class="result-header">
        <span class="result-label">Extracted design.md</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="result-stats" id="resultStats"></span>
          <button class="btn-refresh" id="btnRefresh" title="Re-extract">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="result-preview-wrap">
        <div class="result-preview" id="resultPreview"></div>
        <button class="btn-copy-preview" id="btnCopyPreview" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Frame 16: save + download fallback + CLI -->
    <div class="result-actions">

      <!-- Primary: Save to Project -->
      <button class="btn-save" id="btnSaveToProject">Save to Project</button>

      <!-- Success state after save -->
      <div class="saved-indicator" id="savedIndicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="saved-path" id="savedPath"></span>
      </div>

      <!-- Fallback: Download -->
      <button class="btn-download-link" id="btnDownload">or download to Downloads folder</button>

      <span class="separator">then in Terminal.app (one-time setup)</span>

      <!-- CLI step 1: git clone -->
      <div class="cli-block">
        <span class="cli-label">1. Clone</span>
        <div class="cli-row">
          <span class="cli-cmd" id="cliCloneCmd"></span>
          <button class="btn-copy-cli" id="btnCopyClone" title="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- CLI step 2: install -->
      <div class="cli-block" id="cliInstallBlock">
        <span class="cli-label" id="cliInstallLabel">2. Install skill</span>
        <div class="cli-row">
          <span class="cli-cmd" id="cliCmd"></span>
          <button class="btn-copy-cli" id="btnCopyCli" title="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- CLI step 3: enrich (shown always, labeled as Claude Code) -->
      <span class="separator">then in Claude Code</span>
      <div class="cli-block" id="cliEnrichBlock">
        <span class="cli-label">3. Enrich</span>
        <div class="cli-row">
          <span class="cli-cmd">/enrich-design</span>
          <button class="btn-copy-cli" id="btnCopyEnrich" title="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- VIEW: error -->
  <div data-view="error">
    <div class="error-box" id="errorMsg"></div>
    <button class="btn-extract" id="btnRetry">Try again</button>
  </div>

  <script src="../lib/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
